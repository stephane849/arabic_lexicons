name: Kompakt Release

on:
  push:
    tags:
      - "kompakt-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create/build, e.g. "kompakt-v1.0.1"'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version input
        if: github.event_name == 'workflow_dispatch'
        run: |
          v="${{ inputs.version }}"
          [[ "$v" =~ ^kompakt-v.+ ]] || { echo "version must match kompakt-v*, got: $v"; exit 1; }

      - uses: actions/checkout@v4

      # Caches ~/.gradle, the wrapper distribution included. A release once
      # failed outright on a connection reset while fetching gradle-8.7-bin.zip,
      # which the CI job never hit because it caches — so cache here too.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > kompakt/app/release.jks

      - name: Write key.properties
        run: |
          cat > kompakt/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK
        working-directory: kompakt
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          v="${{ inputs.version || github.ref_name }}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          cp kompakt/app/build/outputs/apk/release/app-release.apk "out/Arabic-Lexicons-Kompakt_${v}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: out/*.apk
          generate_release_notes: true
