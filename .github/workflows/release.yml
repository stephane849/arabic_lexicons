name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip bundled database
        run: unzip -o assets/data/db/db.sqlite.zip -d assets/data/db/

      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/release.jks
          EOF

      - run: flutter pub get

      - name: Build split-per-abi release APKs
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=APP_VERSION=${{ github.ref_name }}
          --dart-define=BUILD_UNIX_TIME=$(date +%s)
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Rename APKs
        run: |
          mkdir -p out
          v="${{ github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk       "out/Arabic-Lexicons_${v}_arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk    "out/Arabic-Lexicons_${v}_armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk        "out/Arabic-Lexicons_${v}_x86_64.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
